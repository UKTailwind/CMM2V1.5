; pc386.ini: the PC that RUN "pc386.app" starts (tiny386's format). Paths are from the current directory.
[pc]
bios = bios.bin
vga_bios = vgabios.bin
; the PC's RAM (as much as the program's memory allows, if less) and its video RAM
mem_size = 4M
vga_mem_size = 256K
; hard disks hda-hdd, CD-ROMs cda-cdd (in place of hdx), floppies fda and fdb: raw images
hda = freedos.img
; the hard disks' sizes in the CMOS, as a BIOS setup would put them
fill_cmos = 1

[cpu]
; 3: a 386 (4, 5, 6: what a program sees as a 486, Pentium or Pentium Pro), and its x87 FPU
gen = 3
fpu = 1
